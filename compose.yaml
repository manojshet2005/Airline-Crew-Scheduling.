# L3.5 Compose stack. Actual execution and verification are recorded in
# CASE57_LAB_EVIDENCE/DOCKER/compose_execution.log.
# The validator is a one-shot service; it exits after writing its database row.

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crew_duty
      POSTGRES_USER: crew
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-case57_demo_only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crew -d crew_duty"]
      interval: 5s
      timeout: 5s
      retries: 10

  validator:
    build:
      context: .
      dockerfile: Dockerfile.compose
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: crew_duty
      DATABASE_USER: crew
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-case57_demo_only}
    depends_on:
      db:
        condition: service_healthy
